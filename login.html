<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20382e">
  <meta name="description" content="Readiculous — a private home for readers and writers.">
  <title>Readiculous — Member sign in</title>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <main id="app"><section class="auth-wrap"><a class="brand auth-brand" href="index.html"><span class="brand-mark">R.</span><span>readiculous<span class="brand-dot">.</span><small>A HOME FOR THE BOOK-OBSESSED</small></span></a>
    <div class="auth-card"><div class="eyebrow">WELCOME BACK, READER</div><h1>Come on in.</h1><p>Your reading room is waiting.</p>
    <form id="authForm" class="form-stack"><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Your password"></label><button class="button button-full" type="submit">Sign in <span>↗</span></button></form>
    <p class="auth-switch">Have an invitation? <a href="signup.html">Create an account</a></p><p class="fine-print">Readiculous is a private, invitation-only community. Please keep your invitation code personal.</p></div></section></main>
  <script type="module" src="js/app.js"></script>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
